<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MOMO Cube</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="description"
      content="1×1×1 から 10×10×10 まで選べる 3D のキューブパズル。指やマウスで面をつまんで回し、3 枚の鏡で裏の面も見えます。シャッフルからの時間を計ってベスト記録に挑戦。ヒントと解答つき。登録不要・インストール不要。"
    />
    <meta name="keywords" content="ルービックキューブ,キューブパズル,3D,タイムアタック,パズル,無料,ブラウザゲーム" />
    <link rel="alternate" hreflang="ja" href="https://qiqiroon.github.io/momo/games/cube/" />
    <link rel="alternate" hreflang="en" href="https://qiqiroon.github.io/momo/games/cube/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://qiqiroon.github.io/momo/games/cube/" />
    <link rel="alternate" hreflang="x-default" href="https://qiqiroon.github.io/momo/games/cube/" />
    <link rel="canonical" href="https://qiqiroon.github.io/momo/games/cube/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qiqiroon.github.io/momo/games/cube/" />
    <meta property="og:title" content="MOMO Cube - 3D のキューブパズル" />
    <meta
      property="og:description"
      content="1×1×1 から 10×10×10 まで選べる 3D のキューブパズル。時間を計ってベスト記録に挑戦。登録不要・インストール不要。"
    />
    <meta property="og:image" content="https://qiqiroon.github.io/momo/games/cube/favicon.svg" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <!-- MOMO Works 共通アクセス解析（公開サイトの /momo/lib を指す。開発サーバーでは読めないが害はない） -->
    <script src="/momo/lib/momo-analytics.js" defer></script>
    <!-- MOMO Works の共通フォント（app-card-design §1.3：3 つまとめて 1 行） -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- MOMO 共通の言語ルーチン（lib/momo-lang）は src/i18n/langMode.ts から読み込む -->
    <style>
      /* MOMO Works デザイン仕様 v1.0 §1：色は黒・白・オレンジの 3 色体系。直書きしない */
      :root {
        --bg: #0a0a0a; --surface: #111111; --surface2: #1a1a1a;
        --orange: #c2410c; --orange-mid: #ea580c; --orange-light: #fb923c;
        --text: #e5e5e5; --text-muted: #737373;
        --border: #2a2a2a; --border-strong: #444;
        --bg-selected: rgba(194,65,12,0.15);
      }
      html, body { margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.4 'Noto Sans JP', system-ui, sans-serif; }
      html:lang(zh-Hans) body { font-family: 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif; }
      /* ゲームは画面いっぱい（#app）。その下に説明のフッターがあり、ページを下へ送ると見える。
         キャンバスは touch-action: none なので、キューブを回してもページは動かない */
      #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
      /* 背景の 48px の格子（§3 方式B） */
      body {
        background-image: linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 48px 48px; background-attachment: fixed; }
      body::before { content: ''; position: fixed; inset: 0; background: var(--bg); opacity: 0.8;
        pointer-events: none; z-index: 0; }
      body > * { position: relative; z-index: 1; }
      button, select, input { font: inherit; }
      button { color: var(--text); background: var(--surface2); border: 1px solid var(--border-strong); border-radius: 6px;
        padding: 4px 10px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--orange); color: var(--orange-light); }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--orange-light); outline-offset: 1px; }
      button:disabled { opacity: .4; cursor: default; }
      button.active { background: var(--bg-selected); border-color: var(--orange); color: var(--orange-light); }
      button.danger { background: var(--orange); border-color: var(--orange-mid); color: #fff; }
      button.danger:hover:not(:disabled) { background: var(--orange-mid); color: #fff; }
      .settings-btn { display: inline-flex; gap: 5px; align-items: center; }
      input[type="checkbox"] { accent-color: var(--orange); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      select { color: var(--text); background: var(--surface2); border: 1px solid var(--border-strong); border-radius: 4px; padding: 3px 6px; }

      /* アプリの見出し（app-card-design v1.1 §1〜§4：猫＋キューブの絵・MOMO Cube・版・サブタイトル）。
         並びはそのままに、大きさを 3 分の 2 ほどに縮め、上下の余白も詰める（2026-11-04 作者：キューブの写る面積を取る） */
      #top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 0 12px; }
      .site-header { display: flex; align-items: flex-start; gap: 7px; margin: 6px 0 0;
        animation: fadeDown 0.4s ease-out; }
      .cat-icon { width: 38px; height: 41px; flex-shrink: 0; }
      .title-block { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
      h1 { margin: 0; font-family: 'Fredoka One', cursive; font-size: clamp(1.33rem, 4vw, 1.73rem); font-weight: 400;
        letter-spacing: 0.02em; line-height: 1; display: flex; align-items: baseline; gap: 0.3em; }
      h1 .momo { color: var(--text); }
      h1 .cube { color: var(--orange-mid); }
      h1 .version-tag { color: var(--text-muted); font-size: 0.28em; letter-spacing: 0.04em; align-self: flex-end; padding-bottom: 0.2em; }
      .subtitle { font-family: 'Fredoka One', cursive; color: #888888; letter-spacing: 0; margin: 1px 0 4px;
        font-size: 15px; min-height: 1.2em; animation: fadeDown 0.5s ease-out; }
      .subtitle.zh { font-size: 11px; font-family: 'Fredoka One', 'Noto Sans SC', 'Noto Sans JP', sans-serif; }
      /* 言語の選択（cat-lang-spec：ボタンではなくプルダウン） */
      .lang-select { margin-top: 6px; background: var(--surface2); border: 1px solid var(--border-strong); color: var(--text);
        font-size: 12px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
      .lang-select:focus { border-color: var(--orange); }
      @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
      /* 遊ぶ画面が狭い・低いときは、見出しをタイトルだけに縮める（app-card-design §5） */
      @media (max-width: 639px), (max-height: 720px) {
        .site-header { margin: 3px 0 1px; }
        .site-header .cat-icon, .site-header .subtitle, .site-header .version-tag { display: none; }
        .site-header h1 { font-size: 0.95rem; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85); }
        .lang-select { margin-top: 2px; padding: 1px 5px; font-size: 11px; }
      }

      /* 上の帯：大きさ・時間・手数など */
      #hud { display: flex; gap: 4px 14px; align-items: center; flex-wrap: wrap; padding: 4px 12px;
        background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
      #hud label { display: flex; gap: 6px; align-items: center; }
      /* 上の帯の知らせは 1 行だけ。中身が増えても行を足さず、はみ出た分（後ろの案内から）は見えなくする。
         行が増えると下の画面がずれるため（2026-11-02 作者） */
      #info { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; }
      #info > span + span { margin-left: 12px; }
      @media (max-width: 639px) { #info { flex-basis: 100%; } }
      /* 時間は桁が動いても幅が揺れないよう等幅の数字 */
      /* 時間は大きく明るく（2026-11-02 作者：目立たせる）。計っている間はオレンジ、そろったら枠もオレンジ */
      #timer { display: inline-flex; align-items: baseline; gap: 6px; padding: 1px 10px; border-radius: 6px;
        background: var(--surface2); border: 1px solid var(--border-strong); }
      .timer-label { font-size: 13px; color: var(--text); }
      .timer-value { font: 700 22px/1.15 'Noto Sans JP', system-ui, sans-serif; font-variant-numeric: tabular-nums;
        color: var(--text); min-width: 4.4em; }
      #timer.running { border-color: var(--orange); }
      #timer.running .timer-value { color: var(--orange-light); }
      #timer.done { border-color: var(--orange); background: var(--bg-selected); }
      #timer.done .timer-value { color: var(--orange-light); }
      @media (max-width: 639px) { .timer-value { font-size: 19px; } }
      #info .dim { color: var(--text-muted); }

      /* 矢印の横のキーの札（設計 10 §3.3） */
      .arrow-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .arrow-labels[hidden] { display: none; }
      .arrow-key { position: absolute; left: 0; top: 0; padding: 0 4px; border-radius: 4px;
        background: rgba(20,20,24,.82); border: 1px solid #555; color: #f2f2f2; white-space: nowrap;
        font: 11px/1.5 ui-monospace, monospace; }

      #stage { position: relative; flex: 1; min-height: 0; background: #000; }

      /* キューブの上に一瞬浮かぶ「そろった！」（ui/toast.ts）。帯に行を足さない */
      .toast { position: absolute; left: 50%; top: 22%; z-index: 3; pointer-events: none; white-space: nowrap;
        font: 700 34px 'Fredoka One', 'Noto Sans JP', 'Noto Sans SC', sans-serif; color: var(--orange-light);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 2px #000; transform: translate(-50%, 0); opacity: 0; }
      .toast[hidden] { display: none; }
      .toast.play { animation: toastFloat 1.6s ease-out forwards; }
      @keyframes toastFloat {
        0% { opacity: 0; transform: translate(-50%, 12px) scale(0.9); }
        15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        70% { opacity: 1; transform: translate(-50%, -10px); }
        100% { opacity: 0; transform: translate(-50%, -26px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .toast.play { animation: toastFade 1.6s linear forwards; }
        @keyframes toastFade { 0%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
      }
      /* キューブの画面の下の知らせ欄（ui/messageBar.ts）。ふだんは操作の案内で、知らせはそれと入れ替えて出す。
         画面に重ねて置くので、何を出しても画面の大きさ（キューブの写る大きさ）は変わらない（2026-11-04 作者）。
         長い知らせも 2 行まで */
      .message-bar { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 1;
        pointer-events: none; max-width: calc(100% - 16px); box-sizing: border-box; text-align: center;
        font-size: 11px; color: var(--text-muted); background: rgba(0, 0, 0, 0.55); border-radius: 4px; padding: 1px 8px;
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
      .message-bar:empty { display: none; }
      .message-bar[data-tone="info"] { color: var(--text); font-size: 12px; background: rgba(0, 0, 0, 0.75); }
      .message-bar[data-tone="active"] { color: var(--orange-light); font-size: 12px; background: rgba(0, 0, 0, 0.75);
        border: 1px solid var(--orange); }
      .message-bar[data-tone="warn"] { color: #fff; font-size: 12px; background: rgba(194, 65, 12, 0.85); }

      /* そろったときの結果（05 §4.3）。キューブを隠さないよう上に寄せる */
      .result-card { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2;
        background: rgba(17,17,17,.95); border: 1px solid var(--orange); border-radius: 12px; padding: 10px 16px 12px;
        min-width: 220px; max-width: calc(100% - 32px); box-sizing: border-box; }
      .result-card[hidden] { display: none; }
      .result-card h2 { margin: 0 0 6px; font: 400 22px 'Fredoka One', 'Noto Sans JP', 'Noto Sans SC', sans-serif;
        color: var(--orange-mid); text-align: center; }
      .result-row { display: flex; gap: 10px; align-items: baseline; justify-content: center; }
      .result-label { color: var(--text-muted); font-size: 12px; }
      .result-value { font-size: 20px; font-variant-numeric: tabular-nums; }
      .result-badge { color: var(--orange-light); font-size: 12px; font-weight: 700; }
      .result-note { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 4px; }
      .result-footer { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
      #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%;
        touch-action: none; }

      /* 操作パネル（設計 04 §6・05 §1） */
      .panel { background: var(--surface); border-top: 1px solid var(--border); padding: 6px 10px 8px;
        padding-bottom: max(8px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px;
        max-height: 45vh; overflow-y: auto; box-sizing: border-box; }
      .panel[hidden] { display: none; }
      /* 下のパネルのタグ（ui/dock.ts）。押すと出す・切り替える、出ているタグをもう一度押すとしまう */
      .dock-tabs { display: flex; gap: 4px; align-items: flex-end; padding: 4px 10px 0; background: var(--bg);
        border-top: 1px solid var(--border); }
      .dock-tab { border-radius: 6px 6px 0 0; border-bottom-color: transparent; padding: 3px 14px; min-height: 30px;
        color: var(--text-muted); }
      .dock-tab.active { background: var(--surface); color: var(--orange-light); border-color: var(--orange);
        border-bottom-color: var(--surface); }
      .dock-toggle { margin-left: auto; margin-bottom: 3px; font-size: 12px; padding: 2px 10px; }
      /* しまっているときは、タグの行だけで画面の下を閉じる */
      #dock:has(.dock-toggle[aria-expanded="false"]) .dock-tabs { padding-bottom: max(4px, env(safe-area-inset-bottom)); }

      /* 手順の記録・再生のパネル（ui/sequencePanel.ts） */
      /* 手順のパネル：1 行目（手順の大きさ・追加…）はいつも出し、一覧だけをスクロールする（2026-11-04 作者） */
      .seq-panel { overflow-y: hidden; }
      .seq-head { gap: 6px; flex-shrink: 0; }
      .seq-list { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
      .seq-add { border-color: var(--orange); }
      /* 手順セットの説明を書く箱（「説明追加」で開く） */
      .seq-note-box { display: flex; gap: 6px; align-items: flex-start; flex-shrink: 0; }
      .seq-note-box[hidden] { display: none; }
      .seq-note-text { flex: 1; min-width: 0; resize: vertical; font: inherit; font-size: 13px; color: var(--text);
        background: var(--surface2); border: 1px solid var(--border-strong); border-radius: 4px; padding: 4px 6px; }
      .seq-note-text:focus { border-color: var(--orange); outline: none; }
      /* プレイ記録のパネル（ui/gamePanel.ts）。1 行目のいまのゲームの中身は、狭い画面では 1 行を占める */
      .game-now { flex: 1 1 14em; min-width: 0; }
      .game-panel .seq-row > button.active { background: var(--bg-selected); border-color: var(--orange); color: var(--orange-light); }
      .seq-list { display: flex; flex-direction: column; gap: 4px; }
      .seq-empty { font-size: 12px; color: var(--text-muted); }
      .seq-row { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; padding: 3px 4px; border-radius: 6px;
        border: 1px solid transparent; }
      .seq-row.recording { border-color: var(--orange); background: var(--bg-selected); }
      .seq-row.playing { border-color: var(--border-strong); }
      /* 名前を選んでいる手順（そのマークを出している） */
      .seq-row.selected:not(.recording) { border-color: var(--orange-mid); }
      .seq-row.selected .seq-name { border-color: var(--orange); }
      .seq-mark.active { background: var(--bg-selected); border-color: var(--orange); color: var(--orange-light); }
      .seq-size { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-muted); }
      .seq-name { flex: 1 1 8em; min-width: 6em; color: var(--text); background: var(--surface2);
        border: 1px solid var(--border-strong); border-radius: 4px; padding: 4px 6px; }
      .seq-name:focus { border-color: var(--orange); outline: none; }
      .seq-info { font-size: 12px; color: var(--text-muted); min-width: 6.5em; font-variant-numeric: tabular-nums; }
      .seq-rec.active { background: var(--orange); border-color: var(--orange-mid); color: #fff; }
      @media (max-width: 639px) {
        .seq-row { padding: 4px 0; border-bottom: 1px solid var(--border); }
        .seq-row > button { min-height: 40px; }
        .seq-name { flex-basis: 100%; }
        .seq-info { flex: 1 1 auto; }
      }
      .panel-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
      .panel-row[hidden] { display: none; }
      .panel-label { color: var(--text-muted); font-size: 12px; }
      .depth-group { display: flex; gap: 4px; }
      .depth { min-width: 34px; }
      .depth[aria-checked="true"] { background: var(--bg-selected); border-color: var(--orange); color: var(--orange-light); }
      .wide { display: flex; gap: 4px; align-items: center; }
      .panel-faces { display: grid; grid-template-columns: repeat(3, max-content); }
      @media (min-width: 1150px) { .panel-faces { grid-template-columns: repeat(6, max-content); } }
      .btn-group { display: flex; gap: 3px; align-items: center; }
      .group-label { min-width: 2.2em; text-align: right; color: var(--text); padding-right: 2px; }
      .turn { display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-width: 40px; min-height: 40px; padding: 2px 6px; line-height: 1.1; }
      .turn .icon { font-size: 17px; }
      .turn .key { font-size: 10px; color: var(--text-muted); }
      .panel-whole .btn-group + .btn-group { margin-left: 6px; }
      .whole-toggle { display: none; }
      .keys-wide { margin-left: auto; }
      /* 基本コマンドの列（シャッフル・そろえる…）。上の帯の下に、いつも出しておく（2026-11-04 作者） */
      #commands { gap: 4px 6px; padding: 4px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
      .shake { animation: shake 120ms linear; }
      @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

      .panel-picker { display: none; }
      .pick[aria-pressed="true"] { background: var(--bg-selected); border-color: var(--orange); color: var(--orange-light); }

      /* 狭い画面（05 §1.1）：面を選ぶ → 向きを選ぶ の 2 段。全体回転の行はボタン 1 つにまとめる（04 §6.4）。
         当たり判定は 44px 以上 */
      @media (max-width: 639px) {
        .panel-whole:not(.open) { display: none; }
        .whole-toggle { display: inline-block; }
        .keys-wide { display: none; }
        #commands { padding: 4px 8px; gap: 4px; }
        #commands > button { padding: 4px 8px; font-size: 13px; min-height: 34px; }
        .turn { min-width: 56px; min-height: 44px; }
        .panel-picker { display: flex; gap: 4px; justify-content: center; }
        .pick { min-width: 44px; min-height: 44px; padding: 2px 6px; }
        .panel-faces { display: flex; justify-content: center; }
        .panel-faces .btn-group:not(.picked) { display: none; }
        .panel-faces .group-label { display: none; }
        .panel-faces:not(:has(.picked)) { display: none; }
      }

      /* 指で触る端末（キーボードが無いことが多い）では、ボタンのキー表示を出さない */
      @media (hover: none) and (pointer: coarse) {
        .turn .key { display: none; }
        .arrow-labels { display: none; }
      }

      /* キーの割り当ての画面 */
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
        align-items: center; justify-content: center; z-index: 10; padding: 16px; }
      .modal-backdrop[hidden] { display: none; }
      .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 14px 16px;
        max-width: 440px; width: 100%; max-height: 100%; overflow-y: auto; box-sizing: border-box; }
      .modal h2 { margin: 0 0 6px; font-size: 16px; }
      .modal .help { font-size: 12px; color: var(--text-muted); margin: 0 0 10px; }
      .keymap-list { display: grid; gap: 4px; }
      .keymap-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .keycap { min-width: 56px; font-family: ui-monospace, monospace; }
      .keycap.waiting { background: var(--bg-selected); border-color: var(--orange-light); }
      .modal .message { min-height: 1.4em; font-size: 12px; color: var(--orange-light); margin: 8px 0; }
      .settings-list { display: grid; gap: 8px; margin-bottom: 10px; }
      .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .settings-list .help { margin: 2px 0 0; }
      .modal-footer { display: flex; justify-content: space-between; gap: 8px; }
      .modal-files { display: flex; gap: 8px; margin-bottom: 10px; }

      /* ページ下の説明（ハノイ・リバーシなど MOMO Works の各ゲームと同じ形） */
      .site-footer { padding: 26px 16px 38px; color: var(--text-muted); text-align: left; }

        <h2 id="foot-about">MOMO Cube について</h2>
        <p id="foot-desc">MOMO Cube は、ブラウザで遊べる無料の 3D キューブパズルです。1×1×1 から 10×10×10 まで大きさを選び、指やマウスで面をつまんで回して、6 つの面の色をそろえます。3 枚の鏡に裏の面が映るので、キューブを回さなくても全体が見えます。シャッフルしてから時間を計り、ベスト記録に挑戦できます。困ったときはヒントと解答も使えます。アカウント登録もインストールも不要で、ブラウザだけですぐに遊べます。</p>
