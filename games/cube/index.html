    <footer class="site-footer momo-about" id="momo-about"><details><summary>MOMO Cube について</summary><div class="momo-about-body"><p>MOMO Cube は、ブラウザで遊べる 3D のキューブパズルです。1×1×1 から 10×10×10 まで大きさを選び、指やマウスで面をつまんで回して、6 つの面の色をそろえます。</p><p>3 枚の鏡に裏の面が映るので、キューブを回さなくても全体が見えます。シャッフルしてから時間を計り、ベスト記録に挑戦できます。困ったときはヒントと解答も使えます。</p><p>アカウント登録もインストールも要りません。</p><div class="momo-about-links"><a href="/momo/">MOMO Works トップ</a><a href="/momo/games/">ゲーム一覧</a><a href="/momo/tools/">ツール一覧</a><span class="momo-about-copy">© MOMO Works</span></div></div></details></footer>

    <script type="application/json" id="momo-about-data">{"ja": {"title": "MOMO Cube について", "body": ["MOMO Cube は、ブラウザで遊べる 3D のキューブパズルです。1×1×1 から 10×10×10 まで大きさを選び、指やマウスで面をつまんで回して、6 つの面の色をそろえます。", "3 枚の鏡に裏の面が映るので、キューブを回さなくても全体が見えます。シャッフルしてから時間を計り、ベスト記録に挑戦できます。困ったときはヒントと解答も使えます。", "アカウント登録もインストールも要りません。"]}, "en": {"title": "About MOMO Cube", "body": ["MOMO Cube is a 3D cube puzzle you can play in your browser. Pick any size from 1×1×1 to 10×10×10, grab a face with your finger or mouse and turn it, and bring all six faces back to one color each.", "Three mirrors show the hidden faces, so you can see the whole cube without turning it around. Scramble it, race the clock and go for your best time. Hints and an automatic solve are there when you get stuck.", "No account, no installation."]}, "zh": {"title": "关于 MOMO Cube", "body": ["MOMO Cube 是一款可在浏览器中游玩的 3D 魔方益智游戏。尺寸可从 1×1×1 选到 10×10×10，用手指或鼠标抓住一个面转动，让六个面各自恢复成同一种颜色。", "三面镜子映出背面，不用转动魔方也能看到全貌。打乱后开始计时，挑战最佳纪录。遇到困难时还可以使用提示和自动解答。", "无需注册账号，也无需安装。"]}}</script>
